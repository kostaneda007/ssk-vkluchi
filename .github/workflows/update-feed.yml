name: Update Apartments Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Download and parse feed
        run: |
          curl -s "https://bx.sskuban.ru/local/integrat/feed/jcat/1293492" -o feed.xml
          
          node << 'EOF'
          const fs = require('fs');
          const xml = fs.readFileSync('feed.xml', 'utf8');
          
          const offers = [];
          const offerRegex = /<offer\s+internal-id="([^"]+)"[^>]*>([\s\S]*?)<\/offer>/g;
          let match;
          
          while ((match = offerRegex.exec(xml)) !== null) {
            const id = match[1];
            const content = match[2];
            
            const getTag = (tag) => {
              const regex = new RegExp(`<${tag}[^>]*>([\\s\\S]*?)<\\/${tag}>`, 'i');
              const m = content.match(regex);
              return m ? m[1].trim() : '';
            };
            
            const category = getTag('category').toLowerCase();
            if (!category.includes('квартира')) continue;
            
            // === ПЛОЩАДЬ (несколько форматов) ===
            let area = '';
            // Формат 1: <area value="95.4"/>
            const areaAttr = content.match(/<area[^>]*value="([^"]*)"/i);
            if (areaAttr) area = areaAttr[1];
            // Формат 2: <area><value>95.4</value></area>
            if (!area) {
              const areaVal = content.match(/<area[^>]*>\s*<value[^>]*>([^<]*)<\/value>/i);
              if (areaVal) area = areaVal[1].trim();
            }
            // Формат 3: <area>95.4</area>
            if (!area) {
              const areaSimple = getTag('area');
              if (areaSimple && !areaSimple.includes('<')) area = areaSimple;
            }
            
            // === ЦЕНА (несколько форматов) ===
            let price = 0;
            // Формат 1: <price value="14596200"/>
            const priceAttr = content.match(/<price[^>]*value="([^"]*)"/i);
            if (priceAttr) price = parseInt(priceAttr[1]) || 0;
            // Формат 2: <price><value>14596200</value></price>
            if (price === 0) {
              const priceVal = content.match(/<price[^>]*>\s*<value[^>]*>([^<]*)<\/value>/i);
              if (priceVal) price = parseInt(priceVal[1].trim()) || 0;
            }
            // Формат 3: <price>14596200</price>
            if (price === 0) {
              const priceSimple = getTag('price');
              if (priceSimple && !priceSimple.includes('<')) {
                price = parseInt(priceSimple) || 0;
              }
            }
            
            // === ИЗОБРАЖЕНИЯ ===
            const images = [];
            const imgRegex = /<image[^>]*>([^<]*)<\/image>/gi;
            let imgMatch;
            while ((imgMatch = imgRegex.exec(content)) !== null && images.length < 5) {
              const src = imgMatch[1].trim();
              if (src) images.push(src);
            }
            
            const apt = {
              id: id,
              rooms: getTag('rooms'),
              total_area: area,
              price: price,
              floor: getTag('floor'),
              buildingSection: getTag('building-section'),
              apartmentNumber: getTag('apartment'),
              description: getTag('description'),
              images: images
            };
            
            // Логируем первые 3 квартиры для проверки
            if (offers.length < 3) {
              console.log(`✅ Квартира ${apt.id}: цена=${apt.price}, площадь=${apt.total_area}, комнат=${apt.rooms}`);
            }
            
            offers.push(apt);
          }
          
          const json = JSON.stringify(offers, null, 2);
          fs.writeFileSync('apartments.json', json);
          console.log(`\n Всего квартир: ${offers.length}`);
          console.log(`📊 Квартир с ценой > 0: ${offers.filter(a => a.price > 0).length}`);
          console.log(`📊 Квартир с ценой = 0: ${offers.filter(a => a.price === 0).length}`);
          EOF
      
      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Check for changes
        id: check
        run: |
          if git diff --quiet --exit-code apartments.json; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "📊 No changes in feed"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "📊 Changes detected in feed"
          fi
      
      - name: Commit and push if changed
        if: steps.check.outputs.changes == 'true'
        run: |
          git add apartments.json
          git commit -m " Автообновление фида: $(date '+%Y-%m-%d %H:%M')"
          git push
          echo "✅ Feed updated successfully"
      
      - name: No changes message
        if: steps.check.outputs.changes == 'false'
        run: echo "🟢 Feed is up to date"
